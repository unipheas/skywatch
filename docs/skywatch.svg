<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title desc">
<title id="title">Skywatch — aircraft overhead, at a glance</title><desc id="desc">Illustrative display concept with fictional SKY123 traffic at 12,500 feet. Automatic location, nearby aircraft, and quiet alerts.</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#24333b"/></pattern><linearGradient id="case" x2="0" y2="1"><stop stop-color="#232a30"/><stop offset="1" stop-color="#111519"/></linearGradient></defs>
<rect width="1440" height="700" rx="28" fill="#0b1118"/><rect width="1440" height="700" rx="28" fill="url(#grid)"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="84" y="82" fill="#52d9ff" font-size="19" letter-spacing="5">SKYWATCH / BUSY BAR</text><text x="84" y="159" fill="#edf5fa" font-size="56" font-weight="700">Look up. There's a plane.</text><text x="84" y="204" fill="#94a8b7" font-size="24">Your little window into the sky.</text></g>
<rect x="199" y="276" width="1042" height="228" rx="38" fill="#030609"/><rect x="207" y="268" width="1026" height="224" rx="35" fill="url(#case)" stroke="#34434e" stroke-width="2"/>
<rect x="246" y="300" width="921" height="158" rx="12" fill="#030708"/>
<circle cx="1192" cy="378" r="6" fill="#ffbe55"/>
<g font-family="monospace" text-anchor="middle"><text x="707" y="368" fill="#ffbe55" font-size="55" font-weight="700" letter-spacing="9">SKY123</text><text x="707" y="424" fill="#9bb3c2" font-size="34" letter-spacing="5">ALT 12500FT</text></g>
<g font-family="Arial,Helvetica,sans-serif"><text x="252" y="550" fill="#6d8495" font-size="16">DISPLAY CONCEPT · FICTIONAL TRAFFIC</text><text x="84" y="632" fill="#52d9ff" font-size="21">AUTO LOCATION</text><text x="541" y="632" fill="#52d9ff" font-size="21">LIVE AIRCRAFT</text><text x="997" y="632" fill="#ffbe55" font-size="21">QUIET ALERTS</text><text x="84" y="661" fill="#94a8b7" font-size="16">IP estimate, with a fixed-location option</text><text x="541" y="661" fill="#94a8b7" font-size="16">Callsign · altitude · heading · distance</text><text x="997" y="661" fill="#94a8b7" font-size="16">An amber pulse when traffic is close</text></g></svg>
